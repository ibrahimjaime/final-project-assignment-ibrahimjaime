# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-data-logger"
BBFILE_PATTERN_meta-data-logger = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-data-logger = "10"

# Update this list to match the Yocto release(s) you actually build against
# (check the release name of the poky branch/tag you're using, e.g. via
# `git branch` in your poky checkout, or `git describe --tags`).
LAYERSERIES_COMPAT_meta-data-logger = "kirkstone langdale mickledore nanbield scarthgap"

# This layer's recipes fetch and build the data-logger app repo, and (for
# the optional custom image) depend on core-image-minimal from oe-core.
LAYERDEPENDS_meta-data-logger = "core"
